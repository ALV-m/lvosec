# ============================================================================
# Workspace packages
# ============================================================================
packages:
  - artifacts/*
  - lib/*
  - scripts

# ============================================================================
# Version catalog
# ============================================================================
catalog:
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  vitest: ^3.2.4
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

# pnpm 11: allow native/optional build scripts for tooling that needs them
# (esbuild bundles the API; @tailwindcss/oxide builds the Tailwind engine).
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  '@swc/core': true
  unrs-resolver: true
  msw: true
