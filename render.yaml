# LVO Security — Render blueprint
# Deploys the Express API + React dashboard.
#
# This blueprint deliberately does NOT provision a database. The app connects
# to a database you already run (e.g. shared with your other Render projects
# or a hosted Postgres). Set the connection string in the Render dashboard:
#   Service -> Environment -> DATABASE_URL
# The app never conflicts with other projects on a shared database because all
# tenant data lives in its own Postgres schema (t<id>).
# See https://render.com/docs/blueprint-spec
#
# RENAMED: this service used to be `computermanagementsystem`. The name is the
# public subdomain and every lab PC stores the absolute URL, so the rename is
# executed with the agent's server_url_rotate action — machines move to the
# new URL *before* the old one is retired, and the shared Postgres keeps their
# token valid across the change. Do not rename casually; follow the runbook:
#   docs/RENDER-RENAME.md
services:
  - type: web
    name: lvosec
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install && pnpm run db:setup && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: PNPM_VERSION
        value: 11.11.0
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        sync: false
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
