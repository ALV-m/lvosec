# LVO Security — Render blueprint
# Deploys the Express API + React dashboard.
#
# This blueprint deliberately does NOT provision a database. The app connects
# to a database you already run (e.g. shared with your other Render projects
# or a hosted Postgres). Set the connection string in the Render dashboard:
#   Service -> Environment -> DATABASE_URL
# The app never conflicts with other projects on a shared database because all
# tenant data lives in its own Postgres schema (t<id>).
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    # Kept as-is on purpose. This name determines the public subdomain, and
    # every lab PC's boot task stores an absolute URL pointing at it. Renaming
    # would take the whole fleet offline until each scheduled task was updated.
    # Safe to change once the fleet is small enough to re-provision by hand.
    name: computermanagementsystem
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install && pnpm run db:setup && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: PNPM_VERSION
        value: 11.11.0
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        sync: false
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
